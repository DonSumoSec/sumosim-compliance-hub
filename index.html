<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SumoSim Compliance Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #000000;
    --white: #ffffff;
    --off-white: #f5f5f5;
    --mid: #888888;
    --border: #e0e0e0;
    --red: #e30613;
    --dark: #111111;
    --text: #1a1a1a;
    --green: #00875a;
    --amber: #e07000;
    --blue: #0052cc;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--black);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-logo {
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.02em;
  }
  .topbar-logo span { color: var(--red); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .sync-btn {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid #333;
    border-radius: 4px;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .sync-btn:hover { border-color: var(--red); color: var(--white); }
  .sync-btn.syncing { color: var(--red); border-color: var(--red); }

  .last-sync {
    font-size: 10px;
    color: #444;
    font-family: 'DM Mono', monospace;
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: calc(100vh - 52px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: #080808;
    border-right: 1px solid #1a1a1a;
    padding: 24px 0;
    position: sticky;
    top: 52px;
    height: calc(100vh - 52px);
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 2px; }
  .sidebar::-webkit-scrollbar-thumb { background: #222; }

  .sidebar-section { padding: 0 16px; margin-bottom: 24px; }

  .sidebar-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
    padding: 0 8px;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 5px;
    color: #555;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.12s;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    margin-bottom: 1px;
  }
  .nav-btn:hover { background: #141414; color: #ccc; }
  .nav-btn.active { background: #1a1a1a; color: var(--white); }
  .nav-btn.active .nav-dot { background: var(--red); }

  .nav-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #2a2a2a;
    flex-shrink: 0;
    transition: background 0.12s;
  }

  .nav-badge {
    margin-left: auto;
    font-size: 8px;
    padding: 2px 5px;
    border-radius: 3px;
    font-family: 'DM Mono', monospace;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .badge-live { background: rgba(0,135,90,0.15); color: #00875a; }
  .badge-draft { background: rgba(224,112,0,0.15); color: #e07000; }
  .badge-review { background: rgba(0,82,204,0.15); color: #0052cc; }

  .sidebar-loading {
    padding: 20px 24px;
    font-size: 11px;
    color: #333;
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── CONTENT ── */
  .content {
    padding: 40px 52px;
    max-width: 820px;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ── LOADING STATE ── */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 50vh;
    gap: 16px;
    color: #888;
  }

  .spinner {
    width: 32px; height: 32px;
    border: 2px solid #1a1a1a;
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: #444;
    letter-spacing: 0.1em;
  }

  /* ── ERROR STATE ── */
  .error-box {
    background: #0a0a0a;
    border: 1px solid #2a0000;
    border-radius: 8px;
    padding: 24px;
    margin: 40px 0;
  }
  .error-title { font-size: 13px; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .error-msg { font-size: 12px; color: #888; font-family: 'DM Mono', monospace; line-height: 1.6; }
  .error-hint { font-size: 12px; color: #555; margin-top: 12px; line-height: 1.6; }

  /* ── PAGE HEADER ── */
  .page-header {
    border-bottom: 2px solid var(--black);
    padding-bottom: 20px;
    margin-bottom: 32px;
  }

  .page-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .meta-tag {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mid);
    font-family: 'DM Mono', monospace;
  }

  .page-title {
    font-size: clamp(20px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .page-subtitle { font-size: 14px; color: var(--mid); }

  .page-info {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .info-label { font-size: 10px; color: var(--mid); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.08em; }
  .info-value { font-weight: 600; font-size: 13px; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.05em;
    font-family: 'DM Mono', monospace;
    vertical-align: middle;
  }
  .pill-live { background: rgba(0,135,90,0.1); color: var(--green); }
  .pill-draft { background: rgba(224,112,0,0.1); color: var(--amber); }
  .pill-review { background: rgba(0,82,204,0.1); color: var(--blue); }
  .pill-archived { background: rgba(100,100,100,0.1); color: #888; }

  /* ── DASHBOARD ── */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--black);
    padding: 20px;
    border-radius: 6px;
  }

  .stat-num {
    font-size: 36px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    line-height: 1;
    margin-bottom: 4px;
  }
  .num-white { color: var(--white); }
  .num-green { color: #00d68f; }
  .num-amber { color: #ffb800; }
  .num-blue { color: #5c8dff; }

  .stat-label { font-size: 10px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── DOC TABLE ── */
  .doc-table { width: 100%; border-collapse: collapse; font-size: 12px; }

  .doc-table th {
    background: var(--black);
    color: var(--white);
    padding: 9px 12px;
    text-align: left;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .doc-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .doc-table tr:hover td { background: #fafafa; cursor: pointer; }
  .doc-table tr.draft-row td { opacity: 0.7; }

  /* ── DOC CONTENT ── */
  .doc-section { margin-bottom: 32px; }

  .doc-section h2 {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
  }

  .doc-section p {
    font-size: 14px;
    line-height: 1.8;
    color: #333;
    margin-bottom: 10px;
  }

  .draft-callout {
    background: #fffbf0;
    border-left: 3px solid var(--amber);
    padding: 12px 16px;
    margin: 12px 0;
    font-size: 13px;
    color: #666;
    border-radius: 0 4px 4px 0;
  }

  .claude-note {
    background: #f0f4ff;
    border-left: 3px solid var(--blue);
    padding: 10px 14px;
    margin: 10px 0;
    font-size: 11px;
    color: var(--blue);
    font-family: 'DM Mono', monospace;
    border-radius: 0 4px 4px 0;
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 5px 10px;
    background: var(--off-white);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.12s;
    margin-top: 12px;
  }
  .copy-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }

  /* ── ANIMATE ── */
  .view.active { animation: fadeUp 0.25s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">Sumo<span>Sim</span> &nbsp;·&nbsp; <span style="color:#444;font-size:13px;font-weight:400">Compliance Hub</span></div>
  <div class="topbar-right">
    <span class="last-sync" id="lastSync">Not synced</span>
    <button class="sync-btn" id="syncBtn" onclick="loadAll()">↻ Sync from SharePoint</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-loading" id="sidebarLoading">
      <div class="spinner" style="width:14px;height:14px;border-width:1px"></div>
      Loading docs…
    </div>
  </nav>

  <main class="content" id="mainContent">
    <div class="loading-screen" id="loadingScreen">
      <div class="spinner"></div>
      <div class="loading-text">Connecting to SharePoint…</div>
    </div>
    <div id="viewContainer"></div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIGURATION — update these two values for your SharePoint
// ─────────────────────────────────────────────────────────────
const CONFIG = {
  siteUrl: 'YOUR_SHAREPOINT_SITE_URL',        // e.g. https://yourcompany.sharepoint.com/sites/sumosim
  docsList: 'Compliance Documents',
  contentList: 'Compliance Content Library',
};

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let state = {
  docs: [],
  content: [],
  loaded: false,
  activeDoc: null,
  view: 'dashboard',
};

// ─────────────────────────────────────────────────────────────
// SHAREPOINT REST API
// ─────────────────────────────────────────────────────────────
async function spGet(listName, select = '', filter = '') {
  let url = `${CONFIG.siteUrl}/_api/web/lists/getbytitle('${encodeURIComponent(listName)}')/items?$top=500`;
  if (select) url += `&$select=${select}`;
  if (filter) url += `&$filter=${filter}`;

  const res = await fetch(url, {
    headers: {
      'Accept': 'application/json;odata=nometadata',
      'Content-Type': 'application/json',
    },
    credentials: 'include',
  });

  if (!res.ok) throw new Error(`SharePoint API error: ${res.status} ${res.statusText}`);
  const data = await res.json();
  return data.value;
}

// ─────────────────────────────────────────────────────────────
// LOAD DATA
// ─────────────────────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('syncBtn');
  btn.classList.add('syncing');
  btn.textContent = '↻ Syncing…';

  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('viewContainer').innerHTML = '';

  try {
    const [docs, content] = await Promise.all([
      spGet(CONFIG.docsList,
        'Title,Category,DocVersion,Status,ReviewedBy,LastReviewed,NextReview,WebsiteURL,Published,Notes'),
      spGet(CONFIG.contentList,
        'Title,Section,LiveContent,DraftContent,ClaudeNotes,SortOrder',
        '',
      ),
    ]);

    // Sort content by SortOrder
    content.sort((a, b) => (a.SortOrder || 0) - (b.SortOrder || 0));

    state.docs = docs;
    state.content = content;
    state.loaded = true;

    document.getElementById('lastSync').textContent =
      'Synced ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    renderSidebar();
    showDashboard();

  } catch (err) {
    showError(err);
  } finally {
    btn.classList.remove('syncing');
    btn.textContent = '↻ Sync from SharePoint';
    document.getElementById('loadingScreen').style.display = 'none';
  }
}

// ─────────────────────────────────────────────────────────────
// SIDEBAR
// ─────────────────────────────────────────────────────────────
function renderSidebar() {
  const categories = [
    { key: 'Legal',    label: 'Legal' },
    { key: 'Privacy',  label: 'Privacy' },
    { key: 'Security', label: 'Security' },
    { key: 'Consumer', label: 'Consumer' },
    { key: 'Telecoms', label: 'MVNO & Crypto' },
    { key: 'Crypto',   label: null },  // merged into above
  ];

  const grouped = {};
  state.docs.forEach(doc => {
    const cat = doc.Category || 'Other';
    const group = cat === 'Crypto' ? 'Telecoms' : cat;
    if (!grouped[group]) grouped[group] = [];
    grouped[group].push(doc);
  });

  const badgeClass = { Live: 'badge-live', Draft: 'badge-draft', 'Under Review': 'badge-review' };

  let html = `
    <div class="sidebar-section">
      <div class="sidebar-label">Overview</div>
      <button class="nav-btn active" id="nav-dashboard" onclick="showDashboard()">
        <span class="nav-dot"></span> Dashboard
      </button>
    </div>`;

  categories.filter(c => c.label && grouped[c.key]).forEach(cat => {
    html += `<div class="sidebar-section">
      <div class="sidebar-label">${cat.label}</div>`;
    grouped[cat.key].forEach(doc => {
      const bc = badgeClass[doc.Status] || 'badge-draft';
      const shortStatus = doc.Status === 'Under Review' ? 'Review' : doc.Status;
      html += `
        <button class="nav-btn" id="nav-${slugify(doc.Title)}" onclick="showDoc('${escHtml(doc.Title)}')">
          <span class="nav-dot"></span>
          <span style="flex:1;text-align:left;line-height:1.3">${escHtml(doc.Title)}</span>
          <span class="nav-badge ${bc}">${shortStatus}</span>
        </button>`;
    });
    html += `</div>`;
  });

  document.getElementById('sidebar').innerHTML = html;
  document.getElementById('sidebarLoading').remove?.();
}

// ─────────────────────────────────────────────────────────────
// DASHBOARD VIEW
// ─────────────────────────────────────────────────────────────
function showDashboard() {
  setActiveNav('nav-dashboard');
  state.view = 'dashboard';

  const live     = state.docs.filter(d => d.Status === 'Live').length;
  const draft    = state.docs.filter(d => d.Status === 'Draft').length;
  const review   = state.docs.filter(d => d.Status === 'Under Review').length;
  const total    = state.docs.length;

  // Days remaining helper
  const daysUntil = d => {
    if (!d.NextReview) return 999;
    const diff = new Date(d.NextReview) - new Date();
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
  };

  const pillHtml = status => {
    const map = { Live: 'pill-live', Draft: 'pill-draft', 'Under Review': 'pill-review', Archived: 'pill-archived' };
    return `<span class="status-pill ${map[status] || 'pill-draft'}">● ${status}</span>`;
  };

  const rows = [...state.docs]
    .sort((a, b) => daysUntil(a) - daysUntil(b))
    .map(doc => {
      const days = daysUntil(doc);
      const urgency = days < 30 ? '🔴' : days < 90 ? '🟡' : '🟢';
      const dateStr = doc.NextReview
        ? new Date(doc.NextReview).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        : '—';
      return `
        <tr onclick="showDoc('${escHtml(doc.Title)}')" class="${doc.Status === 'Draft' ? 'draft-row' : ''}">
          <td><strong>${escHtml(doc.Title)}</strong></td>
          <td>${escHtml(doc.Category || '')}</td>
          <td style="font-family:'DM Mono',monospace;font-size:11px">${escHtml(doc.DocVersion || '')}</td>
          <td>${pillHtml(doc.Status)}</td>
          <td>${dateStr}</td>
          <td style="text-align:center">${urgency}</td>
          <td style="font-size:11px;color:${doc.Published === 'Yes' ? 'var(--green)' : 'var(--amber)'}">
            ${doc.Published === 'Yes' ? '✓ Yes' : doc.Published || '—'}
          </td>
        </tr>`;
    }).join('');

  setContent(`
    <div class="page-header">
      <div class="page-meta">
        <span class="meta-tag">Compliance Hub</span>
        <span style="color:#ddd">·</span>
        <span class="meta-tag">sumosim.com</span>
      </div>
      <h1 class="page-title">Document Dashboard</h1>
      <p class="page-subtitle">All legal and compliance documents — live from SharePoint.</p>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-num num-white">${total}</div><div class="stat-label">Total Docs</div></div>
      <div class="stat-card"><div class="stat-num num-green">${live}</div><div class="stat-label">Live</div></div>
      <div class="stat-card"><div class="stat-num num-amber">${draft}</div><div class="stat-label">Draft</div></div>
      <div class="stat-card"><div class="stat-num num-blue">${review}</div><div class="stat-label">Under Review</div></div>
    </div>

    <table class="doc-table">
      <thead>
        <tr>
          <th>Document</th><th>Category</th><th>Version</th>
          <th>Status</th><th>Next Review</th><th>Due</th><th>Published</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `);
}

// ─────────────────────────────────────────────────────────────
// DOCUMENT VIEW
// ─────────────────────────────────────────────────────────────
function showDoc(title) {
  const doc = state.docs.find(d => d.Title === title);
  if (!doc) return;

  setActiveNav('nav-' + slugify(title));
  state.view = 'doc';
  state.activeDoc = title;

  const sections = state.content.filter(c => c.Title === title);

  const statusClass = { Live: 'pill-live', Draft: 'pill-draft', 'Under Review': 'pill-review', Archived: 'pill-archived' };

  const formatDate = d => d
    ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
    : '—';

  const sectionsHtml = sections.length > 0
    ? sections.map(s => {
        const content = s.LiveContent || s.DraftContent || '';
        const isDraft = !s.LiveContent && s.DraftContent;
        const note = s.ClaudeNotes;
        return `
          <div class="doc-section">
            <h2>${escHtml(s.Section || '')}</h2>
            ${isDraft ? `<div class="draft-callout">⚠ Draft content — not yet published to website</div>` : ''}
            <p>${escHtml(content)}</p>
            ${note ? `<div class="claude-note">Claude note: ${escHtml(note)}</div>` : ''}
          </div>`;
      }).join('')
    : `<div class="doc-section"><p style="color:#888;font-style:italic">No content sections added yet for this document. Add them via the Compliance Content Library SharePoint list.</p></div>`;

  setContent(`
    <div class="page-header">
      <div class="page-meta">
        <span class="meta-tag">${escHtml(doc.Category || '')}</span>
        <span style="color:#ddd">·</span>
        <span class="meta-tag">v${escHtml(doc.DocVersion || '')}</span>
        <span style="color:#ddd">·</span>
        <span class="status-pill ${statusClass[doc.Status] || 'pill-draft'}" style="font-size:10px">● ${escHtml(doc.Status)}</span>
      </div>
      <h1 class="page-title">${escHtml(doc.Title)}</h1>
      <div class="page-info">
        <div><div class="info-label">Last Reviewed</div><div class="info-value">${formatDate(doc.LastReviewed)}</div></div>
        <div><div class="info-label">Next Review</div><div class="info-value">${formatDate(doc.NextReview)}</div></div>
        <div><div class="info-label">Owner</div><div class="info-value">${escHtml(doc.ReviewedBy || '—')}</div></div>
        <div><div class="info-label">Website URL</div><div class="info-value" style="font-family:'DM Mono',monospace;font-size:11px">${escHtml(doc.WebsiteURL || '—')}</div></div>
        <div><div class="info-label">Published</div><div class="info-value" style="color:${doc.Published === 'Yes' ? 'var(--green)' : 'var(--amber)'}">${escHtml(doc.Published || '—')}</div></div>
      </div>
      ${doc.Notes ? `<div style="margin-top:12px;font-size:11px;color:#888;font-family:'DM Mono',monospace">Note: ${escHtml(doc.Notes)}</div>` : ''}
      <button class="copy-btn" onclick="copyContent('${escHtml(title)}')">⎘ Copy content for CMS</button>
    </div>
    ${sectionsHtml}
  `);
}

// ─────────────────────────────────────────────────────────────
// COPY CONTENT
// ─────────────────────────────────────────────────────────────
function copyContent(title) {
  const sections = state.content.filter(c => c.Title === title);
  const text = sections.map(s => `${s.Section}\n\n${s.LiveContent || s.DraftContent || ''}`).join('\n\n---\n\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = '⎘ Copy content for CMS', 2000);
  });
}

// ─────────────────────────────────────────────────────────────
// ERROR VIEW
// ─────────────────────────────────────────────────────────────
function showError(err) {
  document.getElementById('loadingScreen').style.display = 'none';
  setContent(`
    <div class="error-box">
      <div class="error-title">Could not connect to SharePoint</div>
      <div class="error-msg">${escHtml(err.message)}</div>
      <div class="error-hint">
        Make sure:<br>
        1. You are logged into Microsoft 365 in this browser<br>
        2. The siteUrl in CONFIG matches your SharePoint site URL exactly<br>
        3. The list names match: "${CONFIG.docsList}" and "${CONFIG.contentList}"<br>
        4. This file is served from within the SharePoint domain (not file://)
      </div>
    </div>
    <button class="copy-btn" onclick="loadAll()" style="margin-top:16px">↻ Try again</button>
  `);
}

// ─────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────
function setContent(html) {
  const container = document.getElementById('viewContainer');
  container.innerHTML = `<div class="view active">${html}</div>`;
}

function setActiveNav(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]/g, '-');
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
loadAll();
</script>
